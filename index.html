<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- COVER -->

        <section class="cover">

            <img
                class="cover-photo"
                src="images/main.jpeg"
                alt="Wedding Photo"
            >

            <div class="cover-text">

                <p class="names">
                    Taehyuk & Yeonjeong
                </p>

                <p class="date">
                    December 05, 2026
                </p>

                <p class="time">
                    11:00 AM
                </p>

            </div>

        </section>


        <!-- SECOND SECTION -->

        <section class="story">

            <div class="story-image reveal">

                <img
                    src="images/second.jpeg"
                    alt="Wedding Photo"
                >

            </div>


            <p class="story-text reveal-text">
                마주보며 웃던 우리가 한곳을 향해 나아가려 합니다.
            </p>

        </section>


        <!-- THIRD SECTION -->

        <section class="third">

            <img
                class="third-image reveal"
                src="images/third.jpeg"
                alt="Wedding Photo"
            >

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
